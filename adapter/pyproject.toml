[project]
name = "mt5-claude-adapter"
version = "0.1.0"
description = "FastAPI adapter for MT5 Trading Bot (Phase 1: dummy decider; Phase 2: Claude Opus 4.7)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "anyio>=4.4",
    # zoneinfo has no time-zone database of its own on Windows (V6 sessions, calendar).
    "tzdata>=2024.1",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "bandit>=1.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
